table:
  name: zoho_sync_queue
  schema: public
object_relationships:
- name: company
  using:
    foreign_key_constraint_on: company_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      company:
        user_access:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - company:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - zoho
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - company:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - zoho
            - access:
                _eq: editar
    check:
      _and:
      - company:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - zoho
            - access:
                _eq: editar
