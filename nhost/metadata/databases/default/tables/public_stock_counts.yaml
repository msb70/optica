table:
  name: stock_counts
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: staff
  using:
    foreign_key_constraint_on: staff_id
array_relationships:
- name: stock_count_items
  using:
    foreign_key_constraint_on:
      column: count_id
      table:
        name: stock_count_items
        schema: public
insert_permissions:
- role: user
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter: {}
