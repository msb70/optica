table:
  name: stock
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: product
  using:
    foreign_key_constraint_on: product_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
            - access:
                _eq: editar
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
            - access:
                _eq: editar
