table:
  name: v_stock_alerts
  schema: public
object_relationships:
- name: branch
  using:
    manual_configuration:
      remote_table:
        name: branches
        schema: public
      column_mapping:
        branch_id: id
- name: company
  using:
    manual_configuration:
      remote_table:
        name: companies
        schema: public
      column_mapping:
        company_id: id
- name: product
  using:
    manual_configuration:
      remote_table:
        name: products
        schema: public
      column_mapping:
        product_id: id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
