table:
  name: quote_deposits
  schema: public
object_relationships:
- name: quote
  using:
    foreign_key_constraint_on: quote_id
- name: cash_session
  using:
    foreign_key_constraint_on: cash_session_id
- name: staff
  using:
    foreign_key_constraint_on: staff_id
- name: voucher
  using:
    foreign_key_constraint_on: voucher_id
insert_permissions:
- role: user
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter: {}
