table:
  name: v_customer_timeline
  schema: public
object_relationships:
- name: customer
  using:
    manual_configuration:
      remote_table:
        name: customers
        schema: public
      column_mapping:
        customer_id: id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
