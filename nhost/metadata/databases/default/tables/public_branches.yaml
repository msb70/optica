- name: user_access
  using:
    manual_configuration:
      remote_table:
        schema: public
        name: user_branch_access
      column_mapping:
        id: branch_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - module:
              _in:
              - configuracion
          - access:
              _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - module:
              _in:
              - configuracion
          - access:
              _eq: editar
    check:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - module:
              _in:
              - configuracion
          - access:
              _eq: editar
