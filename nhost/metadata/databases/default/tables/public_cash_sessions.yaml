table:
  name: cash_sessions
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: closer
  using:
    foreign_key_constraint_on: closed_by
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: opener
  using:
    foreign_key_constraint_on: opened_by
array_relationships:
- name: quote_deposits
  using:
    foreign_key_constraint_on:
      column: cash_session_id
      table:
        name: quote_deposits
        schema: public
- name: cash_movements
  using:
    foreign_key_constraint_on:
      column: cash_session_id
      table:
        name: cash_movements
        schema: public
- name: payments
  using:
    foreign_key_constraint_on:
      column: cash_session_id
      table:
        name: payments
        schema: public
- name: sales
  using:
    foreign_key_constraint_on:
      column: cash_session_id
      table:
        name: sales
        schema: public
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      branch:
        user_access:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - caja
                - pos
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - caja
                - pos
            - access:
                _eq: editar
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - caja
                - pos
            - access:
                _eq: editar
