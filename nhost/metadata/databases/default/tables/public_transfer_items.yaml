table:
  name: transfer_items
  schema: public
object_relationships:
- name: product
  using:
    foreign_key_constraint_on: product_id
- name: transfer
  using:
    foreign_key_constraint_on: transfer_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      transfer:
        _or:
        - from_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - to_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - transfer:
          _or:
          - from_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
          - to_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
                - intercompany
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - transfer:
          _or:
          - from_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
          - to_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
                - intercompany
            - access:
                _eq: editar
    check:
      _and:
      - transfer:
          _or:
          - from_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
          - to_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
                - intercompany
            - access:
                _eq: editar
delete_permissions:
- role: user
  permission:
    filter:
      _and:
      - transfer:
          _or:
          - from_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
          - to_branch:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
                - intercompany
            - access:
                _eq: editar
