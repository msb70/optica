table:
  name: transfers
  schema: public
object_relationships:
- name: from_branch
  using:
    foreign_key_constraint_on: from_branch_id
- name: requester
  using:
    foreign_key_constraint_on: requested_by
- name: to_branch
  using:
    foreign_key_constraint_on: to_branch_id
array_relationships:
- name: transfer_items
  using:
    foreign_key_constraint_on:
      column: transfer_id
      table:
        name: transfer_items
        schema: public
insert_permissions:
- role: user
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter: {}
