table:
  name: transfers
  schema: public
object_relationships:
- name: from_branch
  using:
    foreign_key_constraint_on: from_branch_id
- name: requester
  using:
    foreign_key_constraint_on: requested_by
- name: to_branch
  using:
    foreign_key_constraint_on: to_branch_id
array_relationships:
- name: transfer_items
  using:
    foreign_key_constraint_on:
      column: transfer_id
      table:
        name: transfer_items
        schema: public
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _or:
      - from_branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - to_branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - _or:
        - from_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - to_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
                - intercompany
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - _or:
        - from_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - to_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
                - intercompany
            - access:
                _eq: editar
    check:
      _and:
      - _or:
        - from_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - to_branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
                - intercompany
            - access:
                _eq: editar
