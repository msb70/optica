table:
  name: audit_log
  schema: public
object_relationships:
- name: company
  using:
    manual_configuration:
      remote_table:
        name: companies
        schema: public
      column_mapping:
        company_id: id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      company:
        user_access:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
