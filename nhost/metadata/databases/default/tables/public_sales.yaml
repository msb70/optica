table:
  name: sales
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: cash_session
  using:
    foreign_key_constraint_on: cash_session_id
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: customer
  using:
    foreign_key_constraint_on: customer_id
- name: exam
  using:
    foreign_key_constraint_on: exam_id
- name: optometrist
  using:
    foreign_key_constraint_on: optometrist_id
- name: quote
  using:
    foreign_key_constraint_on: quote_id
- name: seller
  using:
    foreign_key_constraint_on: seller_id
array_relationships:
- name: lab_orders
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: lab_orders
        schema: public
- name: payments
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: payments
        schema: public
- name: rmas
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: rmas
        schema: public
- name: sale_items
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: sale_items
        schema: public
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      branch:
        user_access:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - pos
                - cajon
                - cotizaciones
                - caja
                - ordenes
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - pos
                - cajon
                - cotizaciones
                - caja
                - ordenes
            - access:
                _eq: editar
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - pos
                - cajon
                - cotizaciones
                - caja
                - ordenes
            - access:
                _eq: editar
