table:
  name: sales
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: cash_session
  using:
    foreign_key_constraint_on: cash_session_id
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: customer
  using:
    foreign_key_constraint_on: customer_id
- name: exam
  using:
    foreign_key_constraint_on: exam_id
- name: optometrist
  using:
    foreign_key_constraint_on: optometrist_id
- name: quote
  using:
    foreign_key_constraint_on: quote_id
- name: seller
  using:
    foreign_key_constraint_on: seller_id
array_relationships:
- name: lab_orders
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: lab_orders
        schema: public
- name: payments
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: payments
        schema: public
- name: rmas
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: rmas
        schema: public
- name: sale_items
  using:
    foreign_key_constraint_on:
      column: sale_id
      table:
        name: sale_items
        schema: public
insert_permissions:
- role: user
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter: {}
