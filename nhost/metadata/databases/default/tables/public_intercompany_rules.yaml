table:
  name: intercompany_rules
  schema: public
object_relationships:
- name: issuer_company
  using:
    foreign_key_constraint_on: issuer_company_id
- name: receiver_company
  using:
    foreign_key_constraint_on: receiver_company_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _or:
      - issuer_company:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - receiver_company:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - _or:
        - issuer_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - receiver_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - intercompany
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - _or:
        - issuer_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - receiver_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - intercompany
            - access:
                _eq: editar
    check:
      _and:
      - _or:
        - issuer_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - receiver_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - intercompany
            - access:
                _eq: editar
