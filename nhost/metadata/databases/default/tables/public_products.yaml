table:
  name: products
  schema: public
object_relationships:
- name: supplier
  using:
    foreign_key_constraint_on: supplier_id
array_relationships:
- name: intercompany_items
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: intercompany_items
        schema: public
- name: quote_items
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: quote_items
        schema: public
- name: rmas
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: rmas
        schema: public
- name: sale_items
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: sale_items
        schema: public
- name: stock
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: stock
        schema: public
- name: stock_count_items
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: stock_count_items
        schema: public
- name: stock_movements
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: stock_movements
        schema: public
- name: transfer_items
  using:
    foreign_key_constraint_on:
      column: product_id
      table:
        name: transfer_items
        schema: public
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - module:
              _in:
              - configuracion
              - stock
          - access:
              _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - module:
              _in:
              - configuracion
              - stock
          - access:
              _eq: editar
    check:
      _exists:
        _table:
          schema: public
          name: user_module_access
        _where:
          _and:
          - user_id:
              _eq: X-Hasura-User-Id
          - module:
              _in:
              - configuracion
              - stock
          - access:
              _eq: editar
