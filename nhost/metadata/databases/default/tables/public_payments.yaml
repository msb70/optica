table:
  name: payments
  schema: public
object_relationships:
- name: cash_session
  using:
    foreign_key_constraint_on: cash_session_id
- name: sale
  using:
    foreign_key_constraint_on: sale_id
- name: voucher
  using:
    foreign_key_constraint_on: voucher_id
insert_permissions:
- role: user
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter: {}
