table:
  name: intercompany_items
  schema: public
object_relationships:
- name: doc
  using:
    foreign_key_constraint_on: doc_id
- name: product
  using:
    foreign_key_constraint_on: product_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      doc:
        _or:
        - issuer_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
        - receiver_company:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - doc:
          _or:
          - issuer_company:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
          - receiver_company:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - intercompany
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - doc:
          _or:
          - issuer_company:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
          - receiver_company:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - intercompany
            - access:
                _eq: editar
    check:
      _and:
      - doc:
          _or:
          - issuer_company:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
          - receiver_company:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - intercompany
            - access:
                _eq: editar
