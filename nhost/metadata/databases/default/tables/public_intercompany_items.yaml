          - receiver_company:
              user_access:
                user_id:
                  _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - intercompany
            - access:
                _eq: editar
