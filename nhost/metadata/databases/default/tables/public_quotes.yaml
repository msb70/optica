table:
  name: quotes
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: customer
  using:
    foreign_key_constraint_on: customer_id
- name: exam
  using:
    foreign_key_constraint_on: exam_id
- name: seller
  using:
    foreign_key_constraint_on: seller_id
array_relationships:
- name: lab_orders
  using:
    foreign_key_constraint_on:
      column: quote_id
      table:
        name: lab_orders
        schema: public
- name: quote_deposits
  using:
    foreign_key_constraint_on:
      column: quote_id
      table:
        name: quote_deposits
        schema: public
- name: quote_items
  using:
    foreign_key_constraint_on:
      column: quote_id
      table:
        name: quote_items
        schema: public
- name: sales
  using:
    foreign_key_constraint_on:
      column: quote_id
      table:
        name: sales
        schema: public
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      branch:
        user_access:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - cotizaciones
                - cajon
                - examenes
                - pos
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - cotizaciones
                - cajon
                - examenes
                - pos
            - access:
                _eq: editar
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - cotizaciones
                - cajon
                - examenes
                - pos
            - access:
                _eq: editar
