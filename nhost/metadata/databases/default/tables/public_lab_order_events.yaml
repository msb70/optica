table:
  name: lab_order_events
  schema: public
object_relationships:
- name: lab_order
  using:
    foreign_key_constraint_on: lab_order_id
- name: staff
  using:
    foreign_key_constraint_on: staff_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      lab_order:
        branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - lab_order:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - ordenes
                - cajon
                - rma
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - lab_order:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - ordenes
                - cajon
                - rma
            - access:
                _eq: editar
    check:
      _and:
      - lab_order:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - ordenes
                - cajon
                - rma
            - access:
                _eq: editar
