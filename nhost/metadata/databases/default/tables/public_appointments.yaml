table:
  name: appointments
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: customer
  using:
    foreign_key_constraint_on: customer_id
- name: optometrist
  using:
    foreign_key_constraint_on: optometrist_id
array_relationships:
- name: exams
  using:
    foreign_key_constraint_on:
      column: appointment_id
      table:
        name: exams
        schema: public
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      branch:
        user_access:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - agenda
                - clientes
                - examenes
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - agenda
                - clientes
                - examenes
            - access:
                _eq: editar
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - agenda
                - clientes
                - examenes
            - access:
                _eq: editar
