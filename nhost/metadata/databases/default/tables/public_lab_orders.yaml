table:
  name: lab_orders
  schema: public
object_relationships:
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: customer
  using:
    foreign_key_constraint_on: customer_id
- name: exam
  using:
    foreign_key_constraint_on: exam_id
- name: sale
  using:
    foreign_key_constraint_on: sale_id
array_relationships:
- name: lab_order_events
  using:
    foreign_key_constraint_on:
      column: lab_order_id
      table:
        name: lab_order_events
        schema: public
insert_permissions:
- role: user
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter: {}
