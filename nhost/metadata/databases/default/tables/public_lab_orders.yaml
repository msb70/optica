table:
  name: lab_orders
  schema: public
object_relationships:
- name: quote
  using:
    foreign_key_constraint_on: quote_id
- name: branch
  using:
    foreign_key_constraint_on: branch_id
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: customer
  using:
    foreign_key_constraint_on: customer_id
- name: exam
  using:
    foreign_key_constraint_on: exam_id
- name: sale
  using:
    foreign_key_constraint_on: sale_id
array_relationships:
- name: lab_order_events
  using:
    foreign_key_constraint_on:
      column: lab_order_id
      table:
        name: lab_order_events
        schema: public
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      branch:
        user_access:
          user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - ordenes
                - cajon
                - rma
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - ordenes
                - cajon
                - rma
            - access:
                _eq: editar
    check:
      _and:
      - branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - ordenes
                - cajon
                - rma
            - access:
                _eq: editar
