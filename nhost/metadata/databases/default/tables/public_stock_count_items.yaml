table:
  name: stock_count_items
  schema: public
object_relationships:
- name: count
  using:
    foreign_key_constraint_on: count_id
- name: product
  using:
    foreign_key_constraint_on: product_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      count:
        branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - count:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - count:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
            - access:
                _eq: editar
    check:
      _and:
      - count:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
            - access:
                _eq: editar
delete_permissions:
- role: user
  permission:
    filter:
      _and:
      - count:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - stock
            - access:
                _eq: editar
