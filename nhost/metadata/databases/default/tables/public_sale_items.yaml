table:
  name: sale_items
  schema: public
object_relationships:
- name: product
  using:
    foreign_key_constraint_on: product_id
- name: sale
  using:
    foreign_key_constraint_on: sale_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      sale:
        branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - sale:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - pos
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - sale:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - pos
            - access:
                _eq: editar
    check:
      _and:
      - sale:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - pos
            - access:
                _eq: editar
