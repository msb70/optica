table:
  name: vouchers
  schema: public
object_relationships:
- name: company
  using:
    foreign_key_constraint_on: company_id
- name: customer
  using:
    foreign_key_constraint_on: customer_id
array_relationships:
- name: payments
  using:
    foreign_key_constraint_on:
      column: voucher_id
      table:
        name: payments
        schema: public
insert_permissions:
- role: user
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter: {}
    check: {}
delete_permissions:
- role: user
  permission:
    filter: {}
