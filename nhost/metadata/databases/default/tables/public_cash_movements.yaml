table:
  name: cash_movements
  schema: public
object_relationships:
- name: cash_session
  using:
    foreign_key_constraint_on: cash_session_id
- name: staff
  using:
    foreign_key_constraint_on: staff_id
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      cash_session:
        branch:
          user_access:
            user_id:
              _eq: X-Hasura-User-Id
    allow_aggregations: true
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - cash_session:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - caja
            - access:
                _eq: editar
    columns: '*'
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      _and:
      - cash_session:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - caja
            - access:
                _eq: editar
    check:
      _and:
      - cash_session:
          branch:
            user_access:
              user_id:
                _eq: X-Hasura-User-Id
      - _exists:
          _table:
            schema: public
            name: user_module_access
          _where:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - module:
                _in:
                - caja
            - access:
                _eq: editar
